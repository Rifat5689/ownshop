name: OwnShop Staging Backend Deployment

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"

      - name: Install API dependencies
        working-directory: ./backend
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint

      - name: Install verification tools
        run: npm ci

      - name: Verify backend behavior
        run: npm test

      - name: Build frontend applications
        run: |
          npm ci --prefix ecommerce
          npm run lint --prefix ecommerce
          npm run build --prefix ecommerce
          npm ci --prefix super-admin
          npm run lint --prefix super-admin
          npm run build --prefix super-admin

      - name: Verify browser interactions
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/
          include-hidden-files: false
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend

      - name: Deploy to Azure staging
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "test-myshop"
          slot-name: "Production"
          package: backend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BE7D38DE4B764F5CAA4E1AD0FD3A2BDD }}
