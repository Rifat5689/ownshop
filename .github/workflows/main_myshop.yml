# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - myshop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install API dependencies
        working-directory: ./backend
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint

      - name: Install verification tools
        run: npm ci

      - name: Verify backend behavior
        run: npm test

      - name: Build frontend applications
        run: |
          npm ci --prefix ecommerce
          npm run lint --prefix ecommerce
          npm run build --prefix ecommerce
          npm ci --prefix super-admin
          npm run lint --prefix super-admin
          npm run build --prefix super-admin

      - name: Verify browser interactions
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'myshop'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_80FB11414B284B5E9DAC697903E01CF4 }}
