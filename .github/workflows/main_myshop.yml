# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - myshop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"

      - name: Install API dependencies
        working-directory: ./backend
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint

      - name: Install verification tools
        run: npm ci

      - name: Verify backend behavior
        run: npm test

      - name: Build frontend applications
        run: |
          npm ci --prefix ecommerce
          npm run lint --prefix ecommerce
          npm run build --prefix ecommerce
          npm ci --prefix super-admin
          npm run lint --prefix super-admin
          npm run build --prefix super-admin

      - name: Verify browser interactions
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend
          # Dependencies were installed on the same Linux platform as App Service.
          # Never package developer credentials or local upload files.
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "myshop"
          slot-name: "Production"
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_80FB11414B284B5E9DAC697903E01CF4 }}

      - name: Verify deployed API readiness
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 15 \
              https://myshop-bhh4bggcgkd9e6hq.centralindia-01.azurewebsites.net/api/v1/health; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployment completed but API readiness failed. Inspect App Service startup logs and database connectivity."
          exit 1
